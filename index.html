<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Degrees of Lewdity</title>
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; background: #050505; overflow: hidden; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #050505; }
    #boot-screen {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 24px;
      box-sizing: border-box;
      color: #e6e6e6;
      background: #050505;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      transition: opacity .25s ease;
    }
    #boot-screen small { color: #999; font-size: 13px; }
    #boot-screen.ready { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot-screen" role="status" aria-live="polite">
    <strong>正在加载游戏…</strong>
    <small>首次打开需要下载游戏资源，请稍候</small>
  </div>
  <iframe id="game" src="./game.html?rev=images-and-sync-manifest-20260924" title="Degrees of Lewdity" loading="eager"></iframe>
  <script>
    document.getElementById("game").addEventListener("load", () => {
      window.setTimeout(() => document.getElementById("boot-screen").classList.add("ready"), 150);
    }, { once: true });
  </script>
</body>
</html>
